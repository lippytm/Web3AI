name: Lint and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    if: hashFiles('backend/requirements.txt') != ''
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt

      - name: Run Ruff linter
        working-directory: ./backend
        run: |
          ruff check .

      - name: Run Ruff formatter check
        working-directory: ./backend
        run: |
          ruff format --check .

      - name: Run pytest
        working-directory: ./backend
        env:
          OPENAI_API_KEY: test-key-placeholder
          MODEL_NAME: GPT-5.1-Codex-Max
          ETH_RPC_URL: https://eth.llamarpc.com
          NETWORK: mainnet
        run: |
          pytest -v

  node-lint-test:
    name: Node/TypeScript Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        directory: [frontend, contracts]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.directory }}
        run: npm ci

      - name: Run linter
        working-directory: ./${{ matrix.directory }}
        run: |
          if [ -f "package.json" ] && grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "No lint script found, skipping"
          fi

      - name: Check formatting
        working-directory: ./${{ matrix.directory }}
        run: |
          if [ -f "package.json" ] && grep -q '"format:check"' package.json; then
            npm run format:check
          else
            echo "No format:check script found, skipping"
          fi

      - name: Run tests
        working-directory: ./${{ matrix.directory }}
        run: npm test

      - name: Build
        working-directory: ./${{ matrix.directory }}
        run: |
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            npm run build
          else
            echo "No build script found, skipping"
          fi
